<!doctype html>
<html lang="pt-BR">
    <body style="margin:0;padding:0;background-color:#fff8f0;">
        <div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.6;color:#463534;max-width:640px;margin:40px auto;background-color:#ffffff;padding:32px;border:1px solid #e8dcd1;border-radius:8px;box-shadow:0 0 8px rgba(70,53,52,0.05);">
            <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
                {% block titulo_oculto %}{% endblock %}
            </h1>
            <h2 style="margin-top:0;color:#94435f;font-size:20px;">
                {% block titulo %}{% endblock %}
            </h2>
            {% block conteudo %}{% endblock %}
            <div style="margin-top:40px;text-align:center;border-top:1px solid #e8dcd1;padding-top:20px;">
                <p style="margin:0;font-size:18px;font-weight:bold;color:#94435f;">Doce Pedido</p>
                <p style="margin:6px 0 0;color:#78625e;font-size:13px;">Uma mensagem automática da sua conta Doce Pedido.</p>
            </div>
        </div>
    </body>
</html>
